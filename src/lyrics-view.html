<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>가사 뷰 — Live MR Manager</title>
  <!--
    가사 뷰 (/lyrics-view) — 퍼포머 본인이 보는 전체 가사 화면.
    OBS 커스텀 브라우저 독이나 별도 브라우저 창에 띄워 사용한다.
    송출용 오버레이(/overlay-lyrics)와 달리 전체 가사를 나열하고
    현재 부르는 줄을 하이라이트 + 자동 스크롤한다.
    폰트 크기는 이 페이지 안에서 조절(브라우저 localStorage에 저장,
    송출 스타일과 무관).

    보안: 곡 제목/아티스트/가사는 모두 신뢰할 수 없는 입력(LRC 파일, 강제
    정렬 결과, 온라인에서 가져온 메타데이터)이므로 innerHTML을 전혀 쓰지
    않는다. 모든 텍스트는 textContent로만 넣고, 줄바꿈은 실제 <br> 요소로
    조립한다 (createElement 기반 안전한 DOM 구성).
  -->
  <style>
    :root {
      --fs: 20px;
      --bg: #0b0b10;
      --text: #e8edf5;
      --dim: rgba(232, 237, 245, 0.42);
      --accent: #3b82f6;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'SUITE', 'Noto Sans KR', sans-serif;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      flex-shrink: 0;
    }
    #song-title {
      font-weight: 800;
      font-size: 0.95rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    #song-artist {
      font-size: 0.75rem;
      color: var(--dim);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .spacer { flex: 1; }
    .fs-btn {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      background: rgba(255, 255, 255, 0.06);
      color: var(--text);
      font-size: 1rem;
      font-weight: 800;
      cursor: pointer;
      flex-shrink: 0;
    }
    .fs-btn:hover { border-color: var(--accent); }

    #lyrics {
      flex: 1;
      overflow-y: auto;
      padding: 18px 16px 45vh; /* 아래 여백: 마지막 줄도 화면 위쪽에서 하이라이트 가능 */
      scroll-behavior: smooth;
      scrollbar-width: thin;
      scrollbar-color: rgba(255,255,255,0.2) transparent;
    }
    .line {
      font-size: var(--fs);
      line-height: 1.55;
      padding: 6px 10px;
      border-radius: 10px;
      color: var(--dim);
      transition: color 0.25s ease, background 0.25s ease;
      word-break: keep-all;
    }
    .line .subline {
      display: block;
      font-size: 0.7em;
      opacity: 0.85;
    }
    .line.active {
      color: var(--text);
      background: rgba(59, 130, 246, 0.14);
      font-weight: 700;
    }
    .line.passed { color: rgba(232, 237, 245, 0.28); }
    #empty {
      color: var(--dim);
      text-align: center;
      padding-top: 30vh;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <header>
    <div style="min-width:0;">
      <div id="song-title">재생 중인 곡 없음</div>
      <div id="song-artist"></div>
    </div>
    <div class="spacer"></div>
    <button type="button" class="fs-btn" id="fs-minus" title="글자 작게">−</button>
    <button type="button" class="fs-btn" id="fs-plus" title="글자 크게">＋</button>
  </header>
  <div id="lyrics"></div>

  <script src="js/overlay/shared.js"></script>
  <script>
    const lyricsEl = document.getElementById('lyrics');
    const titleEl = document.getElementById('song-title');
    const artistEl = document.getElementById('song-artist');

    // 폰트 크기 — 이 페이지 전용(브라우저별 localStorage)
    let fs = parseInt(localStorage.getItem('lyricsViewFontSize'), 10) || 20;
    const applyFs = () => {
      fs = Math.max(12, Math.min(48, fs));
      document.documentElement.style.setProperty('--fs', fs + 'px');
      localStorage.setItem('lyricsViewFontSize', String(fs));
    };
    document.getElementById('fs-minus').onclick = () => { fs -= 2; applyFs(); };
    document.getElementById('fs-plus').onclick = () => { fs += 2; applyFs(); };
    applyFs();

    function showEmptyMessage() {
      lyricsEl.textContent = '';
      const empty = document.createElement('div');
      empty.id = 'empty';
      empty.textContent = '가사가 로드되면 여기에 표시됩니다.';
      lyricsEl.appendChild(empty);
    }

    /** Builds one `.line` element from a lyrics_lines entry without ever using
     * innerHTML — entries may contain multiple sub-lines (원문/차음/번역)
     * joined with `\n` (see lyric-drawer.js), so split on that and render
     * each piece as its own text node / `<br>`, never as markup. */
    function buildLineEl(rawEntry, index) {
      const div = document.createElement('div');
      div.className = 'line';
      div.dataset.index = String(index);
      const parts = String(rawEntry ?? '').split('\n');
      parts.forEach((part, i) => {
        if (i === 0) {
          div.appendChild(document.createTextNode(part));
        } else {
          const sub = document.createElement('span');
          sub.className = 'subline';
          sub.textContent = part;
          div.appendChild(sub);
        }
      });
      return div;
    }

    function renderLines(lines) {
      lyricsEl.textContent = '';
      if (!lines || lines.length === 0) {
        showEmptyMessage();
        return;
      }
      const frag = document.createDocumentFragment();
      lines.forEach((text, i) => frag.appendChild(buildLineEl(text, i)));
      lyricsEl.appendChild(frag);
    }

    let renderedLines = null; // 마지막으로 렌더한 가사(참조 비교 대신 join 키)
    let lastIndex = -2;

    function highlight(index) {
      const nodes = lyricsEl.querySelectorAll('.line');
      nodes.forEach((el, i) => {
        el.classList.toggle('active', i === index);
        el.classList.toggle('passed', index >= 0 && i < index);
      });
      const active = nodes[index];
      if (active) {
        // 현재 줄이 화면 위쪽 1/3 지점에 오도록 스크롤
        const target = active.offsetTop - lyricsEl.clientHeight / 3;
        lyricsEl.scrollTo({ top: Math.max(0, target), behavior: 'smooth' });
      }
    }

    showEmptyMessage();

    OverlayShared.connectWS((data) => {
      titleEl.textContent = data.title || '재생 중인 곡 없음';
      artistEl.textContent = data.artist || '';

      const lines = data.lyrics_lines || data.lyricsLines || [];
      const key = lines.join('\u0000');
      if (key !== renderedLines) {
        renderedLines = key;
        lastIndex = -2;
        renderLines(lines);
      }

      const index = (data.lyric_index ?? data.lyricIndex ?? -1);
      if (index !== lastIndex) {
        lastIndex = index;
        highlight(index);
      }
    });
  </script>
</body>
</html>
