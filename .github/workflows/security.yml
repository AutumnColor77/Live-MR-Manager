name: Security Scan

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # 1) Secrets detection — source tree + full commit history
  # ---------------------------------------------------------------------------
  gitleaks:
    name: Gitleaks (Secrets)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for leaked credentials
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Required only for GitHub Organization repos
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  # ---------------------------------------------------------------------------
  # 2) SAST — Rust + JavaScript/TypeScript structural vulnerabilities
  # ---------------------------------------------------------------------------
  semgrep:
    name: Semgrep (SAST)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: semgrep/semgrep
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Semgrep SAST (fail on ERROR = High/Critical)
        run: |
          semgrep scan \
            --config=p/rust \
            --config=p/javascript \
            --config=p/typescript \
            --config=p/nodejs \
            --config=p/security-audit \
            --severity=ERROR \
            --error \
            --metrics=off \
            --exclude=node_modules \
            --exclude=dist \
            --exclude=build \
            --exclude=target

  # ---------------------------------------------------------------------------
  # 3) SCA — known CVEs in Cargo.lock / package-lock.json dependencies
  # ---------------------------------------------------------------------------
  trivy:
    name: Trivy (SCA)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Scan dependency lockfiles for CVEs
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          # Focus on language package lockfiles (npm / Cargo)
          vuln-type: library
          severity: CRITICAL,HIGH
          exit-code: "1"
          format: table
          ignore-unfixed: true

  # ---------------------------------------------------------------------------
  # 4) Quality Gate — fail workflow if any High/Critical scan failed
  # ---------------------------------------------------------------------------
  quality-gate:
    name: Security Quality Gate
    runs-on: ubuntu-latest
    needs: [gitleaks, semgrep, trivy]
    if: always()
    steps:
      - name: Enforce High/Critical fail policy
        run: |
          echo "Gitleaks: ${{ needs.gitleaks.result }}"
          echo "Semgrep:  ${{ needs.semgrep.result }}"
          echo "Trivy:    ${{ needs.trivy.result }}"

          if [ "${{ needs.gitleaks.result }}" != "success" ] \
            || [ "${{ needs.semgrep.result }}" != "success" ] \
            || [ "${{ needs.trivy.result }}" != "success" ]; then
            echo "::error::Security Quality Gate failed: High/Critical findings or scan errors detected."
            exit 1
          fi

          echo "Security Quality Gate passed."
