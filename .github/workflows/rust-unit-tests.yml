name: Rust Unit Tests

on:
  push:
    branches: [main, develop]
    paths:
      - "src-tauri/**"
      - ".github/workflows/rust-unit-tests.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "src-tauri/**"
      - ".github/workflows/rust-unit-tests.yml"

permissions:
  contents: read

concurrency:
  group: rust-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: cargo test (lmrm-logic)
    # Pure helpers only — avoids linking Windows ORT/DirectML into the test binary
    # (STATUS_ENTRYPOINT_NOT_FOUND on GitHub-hosted runners).
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Run lmrm-logic unit tests
        run: cargo test -p lmrm-logic -- --nocapture
