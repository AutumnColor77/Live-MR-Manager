name: Rust Unit Tests

on:
  push:
    branches: [main, develop]
    paths:
      - "src-tauri/**"
      - ".github/workflows/rust-unit-tests.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "src-tauri/**"
      - ".github/workflows/rust-unit-tests.yml"

permissions:
  contents: read

concurrency:
  group: rust-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: cargo test (lib unit)
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Placeholder VC redist for tauri-build resource check
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path resources | Out-Null
          if (-not (Test-Path resources/vc_redist.x64.exe)) {
            Set-Content -Path resources/vc_redist.x64.exe -Value "ci-placeholder" -NoNewline
          }

      - name: Install Visual C++ Redistributable (ORT native deps)
        shell: pwsh
        run: |
          $url = "https://aka.ms/vs/17/release/vc_redist.x64.exe"
          $out = Join-Path $env:TEMP "vc_redist.x64.exe"
          Invoke-WebRequest -Uri $url -OutFile $out -UseBasicParsing
          $p = Start-Process -FilePath $out -ArgumentList "/install","/quiet","/norestart" -Wait -PassThru
          Write-Host "vc_redist exit: $($p.ExitCode)"

      - name: Build unit test binaries
        shell: pwsh
        run: cargo test --lib --no-run

      - name: Stage ONNX Runtime DLLs next to test binaries
        shell: pwsh
        run: |
          $debug = (Resolve-Path "target/debug").Path
          $deps = Join-Path $debug "deps"
          if (-not (Test-Path $deps)) { throw "missing $deps" }
          $copied = 0
          Get-ChildItem -Path $debug -Recurse -Include "*.dll" -ErrorAction SilentlyContinue |
            Where-Object { $_.DirectoryName -ne $deps } |
            ForEach-Object {
              $dest = Join-Path $deps $_.Name
              Copy-Item $_.FullName -Destination $dest -Force
              Write-Host "Copied $($_.Name) from $($_.DirectoryName)"
              $copied++
            }
          Write-Host "DLL copy count: $copied"
          Get-ChildItem $deps -Filter "*.dll" -ErrorAction SilentlyContinue |
            Select-Object -ExpandProperty Name

      - name: Run focused unit tests
        shell: pwsh
        env:
          ORT_STRATEGY: download
        run: |
          $deps = (Resolve-Path "target/debug/deps").Path
          $debug = (Resolve-Path "target/debug").Path
          $env:PATH = "$deps;$debug;$env:PATH"
          cargo test --lib "songbook_auth::|youtube_url::|ipc_validate::|updater::|library::tests::" -- --nocapture
